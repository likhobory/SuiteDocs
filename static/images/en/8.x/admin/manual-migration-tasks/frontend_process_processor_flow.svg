  <text x="104" y="358" dominant-baseline="central" style="fill:rgb(75, 75, 70);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:12px;font-weight:400;text-anchor:start;dominant-baseline:central">→  $process-&gt;setAsyncHandlerKey('migrate-notes-files')</text>
